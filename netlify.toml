[build]
  command = "bash scripts/netlify-build.sh"
  publish = "web/static"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "https://keep-swinging.netlify.app/*"
  to = "https://keep-swinging.site"
  status = 301
  force = true